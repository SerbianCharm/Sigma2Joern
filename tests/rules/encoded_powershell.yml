title: Test - Encoded PowerShell Not Started By Explorer
id: 17e84db7-c27e-4a91-9d82-6b1d7cf79b76
status: test
description: Test rule for sigma2joern - exclusion filter on unknown context (ParentImage)
author: sigma2joern tests
date: 2026-11-27
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains|windash:
            - ' -enc'
            - ' -EncodedCommand'
    filter_explorer:
        ParentImage|endswith: '\explorer.exe'
    condition: selection and not filter_explorer
level: medium
