title: Test - Scheduled Task Creation
id: 695ca888-ae48-4b6d-8cfb-31722ac4475b
status: test
description: Test rule for sigma2joern - filter on the command line (known) and on the user (unknown)
author: sigma2joern tests
date: 2026-11-27
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains: ' /create '
    filter_query:
        CommandLine|contains: ' /query'
    filter_system:
        User|contains: 'AUTHORI'
    condition: selection and not 1 of filter_*
level: low
