[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma2joern"
version = "0.2.0"
description = "Find code locations that would trigger Sigma process_creation rules when executed (static analysis with Joern)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["pysigma>=2.0,<3"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sigma2joern = "sigma2joern.cli:main"

[project.urls]
Homepage = "https://github.com/SerbianCharm/Sigma2Joern"

[tool.setuptools]
packages = ["sigma2joern"]

[tool.setuptools.package-data]
sigma2joern = ["joern/*.sc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
